# Host runtime policy that pairs with the hypervisor kernel.  This file ships
# in the host image (systemd sysctl.d) -- policy the kernel cannot express as
# Kconfig belongs here, in the image, not only in a tuning doc.
kernel.unprivileged_bpf_disabled = 1
kernel.panic_on_oops = 1
# A VMM core dump is guest memory written to disk.
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false
# io_uring stays ENABLED on the host: Cloud Hypervisor's block datapath uses
# it.  Host userspace is only the agent and the VMM; tenants are guests.
kernel.io_uring_disabled = 0
# The VMM knows the topology it advertised; the balancer does not.
kernel.numa_balancing = 0
vm.swappiness = 0
net.core.default_qdisc = fq
# DCTCP requires verified end-to-end ECN marking on the fabric; fall back to
# bbr on any pool where that is not measured.
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_congestion_control = dctcp
