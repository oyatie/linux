# Node-image policy for the kube-node guest: the one place tenant code shares
# a kernel with the agent, so the agent-only interfaces get fenced here.
# 1 = io_uring only for CAP_SYS_ADMIN / io_uring_group -- the runtime keeps
# it, tenant containers do not.  Enforced by the image, not by a doc.
kernel.io_uring_disabled = 1
kernel.unprivileged_bpf_disabled = 1
fs.suid_dumpable = 0
kernel.panic_on_oops = 1
