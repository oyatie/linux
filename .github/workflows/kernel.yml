name: kvmhost

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fast, no-docker gate -- fails the pipeline before the expensive jobs if a
  # secret leaks into the tree, the promotion gate breaks, or a script is
  # obviously wrong.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no secrets in the tracked tree
        run: make secret-scan
      - name: promotion-gate unit tests
        run: make test
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

  hygiene:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make unused
      # The scoping invariant: every default-on feature is requested, implied,
      # or in the accept-defaults ledger.  validate-all enforces it per tuple;
      # this is a fast standalone check on the default profile for clear CI
      # signal.
      - run: make image
      - run: make audit

  # The full shippable matrix (profile x knobs x both kernel tracks),
  # config-resolution only -- this is where symbol drift and dependency
  # breakage show up, and it is cheap.
  validate:
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make validate-all
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-configs
          path: out/*.config

  # Compile + boot the v1 ship set.  QEMU q35 stands in for CH, QEMU's
  # microvm machine for Firecracker; scripts/fc-smoke.sh runs the real VMM
  # on a KVM-capable runner when one is available.
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: make PROFILE=fc-guest build
      - run: make PROFILE=fc-guest smoke
      - run: make PROFILE=hypervisor build
      - run: make PROFILE=hypervisor smoke
      - uses: actions/upload-artifact@v4
        with:
          name: v1-ship-set
          path: |
            out/bzImage-hypervisor
            out/hypervisor.config
            out/bzImage-fc-guest
            out/vmlinux-fc-guest
            out/fc-guest.config
