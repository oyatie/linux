name: kvmhost

on:
  push:
  pull_request:

jobs:
  # Config resolution is fast and catches the failure mode that matters:
  # a fragment whose symbols no longer exist, or that Kconfig silently drops.
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [hypervisor, worker, control-plane, scheduler]
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make PROFILE=${{ matrix.profile }} config
      - uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.profile }}
          path: out/${{ matrix.profile }}.config

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make build
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: make smoke
      - uses: actions/upload-artifact@v4
        with:
          name: bzImage
          path: |
            out/bzImage-hypervisor
            out/hypervisor.config
